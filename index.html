<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система опроса</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(-45deg, #09090e, #1a0b2e, #050505, #0a1128);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            max-width: 600px;
            width: 85%;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-weight: 300;
            font-size: 26px;
            margin-bottom: 40px;
            letter-spacing: 1px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            transition: opacity 0.5s ease;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 36px;
            border-radius: 50px;
            font-size: 16px;
            font-family: inherit;
            font-weight: 400;
            cursor: pointer;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: all 0.4s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }

        button:hover::before {
            left: 100%;
            transition: 0.7s;
        }

        .fade-out {
            opacity: 0 !important;
            transform: scale(0.98);
        }
        
        .ominous {
            color: #ff4a4a;
            text-shadow: 0 0 25px rgba(255, 74, 74, 0.6);
            font-weight: 600;
            letter-spacing: 2px;
            font-size: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="questionText">Инициализация...</h2>
        <div id="buttonsContainer" class="buttons-wrapper"></div>
    </div>

    <script>
        const questionText = document.getElementById('questionText');
        const buttonsContainer = document.getElementById('buttonsContainer');

        function showQuestion(text, buttons, isOminous = false) {
            questionText.classList.add('fade-out');
            buttonsContainer.classList.add('fade-out');

            setTimeout(() => {
                questionText.innerText = text;
                
                if (isOminous) {
                    questionText.classList.add('ominous');
                } else {
                    questionText.classList.remove('ominous');
                }

                buttonsContainer.innerHTML = '';
                
                buttons.forEach(btn => {
                    const button = document.createElement('button');
                    button.innerText = btn.text;
                    button.onclick = btn.action;
                    buttonsContainer.appendChild(button);
                });

                questionText.classList.remove('fade-out');
                buttonsContainer.classList.remove('fade-out');
            }, 500); 
        }

        // Финальный экран взлома
        function finalHack() {
            showQuestion("Вы успешно взломаны", [], true);
        }

        function prankEnd() {
            showQuestion("Хорошо. Ожидайте неизбежного...", [
                { text: "Страшно", action: finalHack },
                { text: "Страшно", action: finalHack }
            ], true);
        }

        function boringEnd() {
            showQuestion("Опрос завершен. Данные сохранены.", []);
        }

        function askFullName() {
            showQuestion("Подсфирова Алина Дмитриевна, да или нет?", [
                { text: "Да", action: prankEnd },
                { text: "Нет", action: () => showQuestion("Смысла скрывать больше нет.", [
                    { text: "Страшно", action: finalHack },
                    { text: "Страшно", action: finalHack }
                ], true) }
            ]);
        }

        function askName() {
            showQuestion("Вас зовут Алина?", [
                { text: "Да", action: askFullName },
                { text: "Нет", action: boringEnd }
            ]);
        }

        function askBulayevo() {
            showQuestion("Вы живете в Булаево?", [
                { text: "Да", action: askName },
                { text: "Нет", action: boringEnd }
            ]);
        }

        function askPetropavlovsk() {
            showQuestion("Рядом с Петропавловском?", [
                { text: "Да", action: askBulayevo },
                { text: "Нет", action: boringEnd }
            ]);
        }

        function askAstana() {
            showQuestion("Вы живете в Астане?", [
                { text: "Да", action: boringEnd },
                { text: "Нет", action: askPetropavlovsk }
            ]);
        }

        function askKazakhstan() {
            showQuestion("Вы живете в Казахстане?", [
                { text: "Да", action: askAstana },
                { text: "Нет", action: boringEnd }
            ]);
        }

        function startSurvey() {
            showQuestion("Вы девушка или мальчик?", [
                { text: "Девушка", action: askKazakhstan },
                { text: "Мальчик", action: askKazakhstan }
            ]);
        }

        setTimeout(startSurvey, 1000);
    </script>

</body>
</html>
